name: website

on:
  push:
    branches:
      - '*-release'
  workflow_run:
    workflows:
      - release
    types:
      - completed
  workflow_dispatch:

concurrency: website-gh-pages

permissions:
  contents: read

jobs:
  check_branch:
    runs-on: ubuntu-22.04
    outputs:
      should_deploy: ${{ steps.deploy_config.outputs.should_deploy }}
      checkout_ref: ${{ steps.deploy_config.outputs.checkout_ref }}
      target_folder: ${{ steps.deploy_config.outputs.target_folder }}
      website_base_url: ${{ steps.deploy_config.outputs.website_base_url }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Get latest release branch
        id: get_version
        run: |
          package_file=modules/core/package.json
          package_name=$(jq -r '.name' "$package_file")
          latest=$(npm show "${package_name}@latest" version | grep -o -E "^[0-9]+\.[0-9]+")
          echo "latest=${latest}-release" >> "$GITHUB_OUTPUT"

      - name: Resolve deploy config
        id: deploy_config
        env:
          EVENT_NAME: ${{ github.event_name }}
          LATEST_RELEASE_BRANCH: ${{ steps.get_version.outputs.latest }}
          RELEASE_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            # A manual website run is the explicit preview deployment: always publish master at /next,
            # even when the workflow UI was opened from another branch.
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=master" >> "$GITHUB_OUTPUT"
            echo "target_folder=next" >> "$GITHUB_OUTPUT"
            echo "website_base_url=/next/" >> "$GITHUB_OUTPUT"
          elif [ "${EVENT_NAME}" = "workflow_run" ] && [ "${RELEASE_WORKFLOW_CONCLUSION}" = "success" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${LATEST_RELEASE_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "target_folder=" >> "$GITHUB_OUTPUT"
            echo "website_base_url=/" >> "$GITHUB_OUTPUT"
          elif [ "${EVENT_NAME}" = "workflow_run" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=master" >> "$GITHUB_OUTPUT"
            echo "target_folder=" >> "$GITHUB_OUTPUT"
            echo "website_base_url=/" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=master" >> "$GITHUB_OUTPUT"
            echo "target_folder=next" >> "$GITHUB_OUTPUT"
            echo "website_base_url=/next/" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "${LATEST_RELEASE_BRANCH}" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${LATEST_RELEASE_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "target_folder=" >> "$GITHUB_OUTPUT"
            echo "website_base_url=/" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "target_folder=" >> "$GITHUB_OUTPUT"
            echo "website_base_url=/" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check_branch
    if: ${{ github.repository_owner == 'visgl' && needs.check_branch.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.check_branch.outputs.checkout_ref }}
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}

      - name: Setup Node (with Corepack)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack / Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
          yarn -v

      - name: Cache website Yarn artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build website
        env:
          DOCUSAURUS_BASE_URL: ${{ needs.check_branch.outputs.website_base_url }}
        run: yarn build
        working-directory: website

      - name: Disable repository hooks for deployment
        run: git config --global core.hooksPath /dev/null

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # 4.8.0
        with:
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          branch: gh-pages
          folder: website/build
          target-folder: ${{ needs.check_branch.outputs.target_folder }}
          clean: true
          clean-exclude: |
            next

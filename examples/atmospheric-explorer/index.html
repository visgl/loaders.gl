<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atmospheric Explorer</title>
<style>body{margin:0;background:#0d1724;color:#e7eef8;font:14px system-ui}main{display:grid;grid-template-columns:340px 1fr;height:100vh}aside{padding:18px;overflow:auto;border-right:1px solid #334155}h1{font-size:20px}label{display:block;margin:14px 0 5px}input,textarea{box-sizing:border-box;width:100%;padding:9px;background:#15283c;color:#e7eef8;border:1px solid #536479;border-radius:5px}textarea{height:280px;font:12px monospace}button{margin-top:14px;padding:10px 18px;cursor:pointer}#map{position:relative;min-height:500px}#legend{margin-top:14px}small{color:#a8b9ca}</style></head>
<body><main><aside><h1>Atmospheric Explorer</h1><p>ECMWF IFS analysis · loaders.gl + deck.gl</p>
<label for="root">HTTP Zarr root URL</label><input id="root" placeholder="https://…/dataset.zarr">
<label for="config">Array, dimension selection and Gaussian grid JSON</label><textarea id="config" spellcheck="false"></textarea>
<button id="load">Load field</button><p id="status" role="status">Configure a publicly accessible Zarr store.</p><div id="legend"></div>
<p><small>Icechunk repositories require a compatible HTTP-accessible Zarr store or adapter. Dataset attribution: ECMWF / Beyond Weather, CC BY 4.0.</small></p></aside><div id="map"></div></main><script type="module" src="/app.ts"></script></body></html>
